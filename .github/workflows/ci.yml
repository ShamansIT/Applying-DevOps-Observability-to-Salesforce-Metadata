name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Coverage thresholds (vitest.config.ts) plus the determinism and latency-budget tests are
      # regression gates: a coverage drop or a blown budget fails this step.
      - name: Test with coverage and budget gates
        run: npm run test:coverage

      - name: Build extension bundle
        run: npm run build:extension

      # Statistics maths is checked against textbook inputs, and the evaluation pilot runs end to end
      # (build, run core, write results package) as a smoke, both outside the vitest gate.
      - name: Stats tool self-test
        run: npm run eval:stats:selftest

      - name: Evaluation pilot smoke
        run: npm run eval:pilot

      # Experiment harness runs its pipeline end to end offline (mutation, mock oracle, metrics,
      # bundle). Real scratch-org runs are a separate, manually dispatched, credentialed job.
      - name: Experiment harness self-test
        run: npm run exp:selftest

      - name: No TODO(agent) left in src
        run: |
          if grep -rn "TODO(agent)" src; then
            echo "Found TODO(agent) markers in src - resolve them before merging."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # VS Code needs a display; xvfb provides a headless one. Downloads a pinned VS Code, loads the
      # extension, and checks its commands are registered.
      - name: e2e smoke (VS Code)
        run: xvfb-run -a npm run test:e2e
